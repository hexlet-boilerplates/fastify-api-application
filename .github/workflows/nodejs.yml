name: Node CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  CI: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Node берётся из mise.toml
      - uses: jdx/mise-action@v5
      - run: make install
      # Раннера тестов в шаблоне нет, его ставит урок про тестирование,
      # поэтому вместо тестов проверяются формат и типы (те же шаги, что в git-хуке,
      # см. hk.pkl) и живой ответ приложения
      - run: mise exec -- hk check --all
      - name: Приложение поднимается и отвечает
        run: |
          make start &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000 | grep -q '"root":true'; then
              echo "приложение ответило"
              exit 0
            fi
            sleep 1
          done
          echo "приложение не ответило за 30 секунд"
          exit 1
